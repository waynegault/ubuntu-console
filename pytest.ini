[pytest]
# Run from the project virtualenv: `.venv/bin/python3 -m pytest`.
#
# BOX-WIDE VERSION, checked 2026-09-23: every pytest on this machine is 9.1.1 — this
# venv (python 3.14.3, uv), the investigator venv (python 3.12.3), the linuxbrew
# python@3.14 site-packages, the user-site for python3.12 (which is what
# /usr/bin/pytest actually imports, ahead of apt's stale 7.4.4 dist-info), and hence
# the wrapper below as well.  pytest-timeout is uniformly 2.4.0.  CI pins
# `pytest==9.1.1` so it stays that way, for the same reason it pins shellcheck and
# ruff: a local run and CI must not disagree about tool behaviour.
#
# THE PATH WRAPPER IS STILL A TRAP even though the versions now agree.
# `~/.local/bin/pytest` is a hand-written `exec /home/wayne/investigator/.venv/bin/pytest
# "$@"` — a convenience for the INVESTIGATOR repo, created 2026-07-06 — and
# `~/.local/bin` precedes every venv on PATH.  So a bare `pytest` run from this
# directory uses the investigator venv: python 3.12.3 with the INVESTIGATOR's
# site-packages, instead of this venv's python 3.14.3.  The PYTHON MINOR VERSION
# differs, which matters more than the pytest version.  Activate this venv, or name
# its interpreter.
testpaths = tests
python_files = test_*.py
# --strict-markers / --strict-config: WITHOUT them a misspelled marker silently
# becomes a no-op filter and an unknown ini key is ignored — the silent-no-op shape
# this repo works to eliminate.  Every mark the BATS bridge applies dynamically
# (bats, bats_unit, bats_fast, bats_full, bats_integration, bats_default, integration,
# slow) is registered below, and pytest-timeout registers `timeout`; verified
# 2026-09-23: the whole suite collects under both flags (1262 tests, rc=0).
#
# pytest-xdist is installed in the venv but must NOT be used here: tests/conftest.py
# serialises each BATS file with an flock so two suites never run one file at once,
# and `-n` would fight that and produce spurious failures.
addopts = -ra --strict-markers --strict-config --timeout=1000 --timeout_method=thread
markers =
    bats: Shell test suites executed via BATS
    bats_unit: Fast unit-only BATS files
    bats_fast: Static analysis BATS suites (no profile sourcing)
    bats_full: Full runtime behavioural BATS suite (387 tests)
    bats_integration: Integration-level BATS suites (non-hermetic)
    bats_default: Unclassified BATS files
    integration: Long-running integration coverage
    slow: Tests that are expected to take a long time
