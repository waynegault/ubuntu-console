[pytest]
# Run from the project virtualenv: `.venv/bin/python3 -m pytest`.  Every pytest on
# this box is 9.1.1 (checked 2026-09-23; pytest-timeout 2.4.0 throughout), and CI pins
# `pytest==9.1.1` + `pytest-timeout==2.4.0` so it stays that way — the same treatment
# shellcheck (0.11.0) and ruff (0.15.20) get.
#
# `~/.local/bin/pytest` is a WRAPPER, not an install.  It now execs the ENCLOSING
# project's `.venv/bin/pytest` (nearest ancestor wins), falling back to the
# investigator venv outside any project.  It used to ALWAYS exec the investigator venv
# — a convenience written for that repo on 2026-07-06 — and because `~/.local/bin`
# precedes every venv on PATH, a bare `pytest` here ran python 3.12.3 with the
# INVESTIGATOR's site-packages instead of this venv's python 3.14.3.  Fixed
# 2026-09-23, so a bare `pytest` inside this repo is now correct; naming the
# interpreter stays the unambiguous form.
#
# The apt `python3-pytest` (7.4.4, the last sub-9.1.1 pytest on the box) was REMOVED on
# 2026-09-23 along with its two now-orphaned dependencies (python3-iniconfig,
# python3-pluggy).  Consequence, stated rather than discovered later: the SYSTEM
# python3.12 no longer has pytest, and PEP 668 blocks a pip replacement.  That is fine
# because nothing here uses it — CI, VS Code (`python.testing.pytestPath`) and this
# repo's docs all resolve a virtualenv.
testpaths = tests
python_files = test_*.py
# --strict-markers / --strict-config: WITHOUT them a misspelled marker silently
# becomes a no-op filter and an unknown ini key is ignored — the silent-no-op shape
# this repo works to eliminate.  Every mark the BATS bridge applies dynamically
# (bats, bats_unit, bats_fast, bats_full, bats_integration, integration, slow) is
# registered below, and pytest-timeout registers `timeout`; verified
# 2026-09-24: the whole suite collects under both flags (1309 tests, rc=0).
#
# bats_default is deliberately NOT registered: each suite's marker now comes BY NAME
# from tests/bats-suites.tsv, so there is no unclassified fallback left — a name the
# table gets wrong fails collection naming that marker, instead of quietly filing the
# suite under a marker no `-m` selection ever asks for.
#
# pytest-xdist is installed in the venv but must NOT be used here: tests/conftest.py
# serialises each BATS file with an flock so two suites never run one file at once,
# and `-n` would fight that and produce spurious failures.
addopts = -ra --strict-markers --strict-config --timeout=1000 --timeout_method=thread
markers =
    bats: Shell test suites executed via BATS
    bats_unit: Fast unit-only BATS files
    bats_fast: Static analysis BATS suites (no profile sourcing)
    bats_full: Full runtime behavioural BATS suite (387 tests)
    bats_integration: Integration-level BATS suites (non-hermetic)
    integration: Long-running integration coverage
    slow: Tests that are expected to take a long time
