# ==============================================================================
# intel-xe-cuda.conf — the Intel i9 / Iris Xe / RTX 3050 Ti WSL2 box.
# ==============================================================================
# A HOST PROFILE: the per-machine half of this repo.  Everything below is true of
# THIS box and of no other, so it must never be copied into shared code again.
#
# The TAC_HOST_PROFILE_* lines (ARCH/CUDA/RENDER) are MATCHING METADATA read by
# tools/host-profile.sh before the file is sourced; everything else is a value the
# console reads after it.  `: "${VAR:=value}"` keeps an explicit environment
# override winning, which is how a one-off experiment stays out of the profile.
#
# Pick a profile on a box with: LLM_HOST_PROFILE=<id> in ~/.bashrc, or the id on a
# line in ~/.llm/host-profile.  Detection covers this file's own box.
# ==============================================================================

TAC_HOST_PROFILE_ID="intel-xe-cuda"
TAC_HOST_PROFILE_DESCRIPTION="Intel i9 / Iris Xe iGPU / RTX 3050 Ti 4 GB (WSL2 x86_64)"
TAC_HOST_PROFILE_ARCH="x86_64"
TAC_HOST_PROFILE_CUDA=1
TAC_HOST_PROFILE_RENDER=1
TAC_HOST_PROFILE_XE=1

# ---- Model store -------------------------------------------------------------
# The GGUF store is a bind mount on this box.  Another box has its own.
: "${LLAMA_DRIVE_ROOT:=/mnt/m}"

# ---- Tuning defaults ---------------------------------------------------------
# Keep the baseline offload under this card's 4 GB.
: "${LLAMA_GPU_LAYERS:=24}"
# Six P-cores; 01-constants caps this by nproc, so a smaller VM is never told to
# run six.
: "${LLAMA_CPU_THREADS_BASE:=6}"
: "${LLAMA_FIT_TARGET_MB:=1024}"
# Host-RAM tier of llama.cpp's prompt cache.  0 is explicit-disable; the one
# MEASURED per-lane budget is below and is repeated as the literal --cache-ram in
# the lane's unit (tests/unit/23 pins the two together).
: "${LLAMA_CACHE_RAM_MB:=0}"
# `${arr+x}` tests element 0, which this sparse map does not have; `declare -p` is
# the reliable "already declared" test for an associative array.
if ! declare -p LLAMA_CACHE_RAM_MB_BY_PORT >/dev/null 2>&1
then
    declare -gA LLAMA_CACHE_RAM_MB_BY_PORT=(
        [18085]=768   # Xe 3B — 640 MiB re-prefills, 768 MiB hits (2026-10-22)
    )
fi
# Fallback only: the card is asked first.  This is this card's 4 GiB.
: "${VRAM_TOTAL_BYTES_FALLBACK:=4294967296}"

# ---- Quantisation policy -----------------------------------------------------
# The ratings were written for a 4 GB card; a larger card must not inherit them.
: "${LLAMA_QUANT_GUIDE_REL:=config/quant-guide.conf}"

# ---- Resident lanes ----------------------------------------------------------
# unit|port.  Each unit is marked `# install-profile: intel-xe-cuda`, so install.sh
# links these five on this box and none of them on another.  tests/unit/23 pins
# this table against the units' own ExecStart lines.
: "${LLAMA_LANE_SPECS:=llama-xe-minicpm5-1b-chat.service|18081
llama-xe-embeddinggemma-embed.service|18080
llama-xe-llama32-3b-chat.service|18085
llama-cuda-llama32-3b-chat.service|18083
llama-cpu-qwen25-3b-chat.service|18084}"
# The lane `so` treats as the production server (the gateway's baseUrl target), and
# its UNIT name for the messages that name it.
: "${LLM_SERVICE_PORT:=18081}"
: "${TAC_HOST_PRIMARY_LANE:=llama-xe-minicpm5-1b-chat.service}"

# ---- Labels ------------------------------------------------------------------
: "${TAC_HOST_GPU_LABEL:=RTX 3050 Ti}"
: "${TAC_HOST_IGPU_LABEL:=Intel Xe}"

# end of file
