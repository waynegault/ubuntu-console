# ==============================================================================
# intel-xe-cuda.conf — the Intel i9 / Iris Xe / RTX 3050 Ti WSL2 box.
# ==============================================================================
# A HOST PROFILE: the per-machine half of this repo.  Everything below is true of
# THIS box and of no other, so it must never be copied into shared code again.
#
# The TAC_HOST_PROFILE_* lines (ARCH/CUDA/RENDER) are MATCHING METADATA read by
# tools/host-profile.sh before the file is sourced; everything else is a value the
# console reads after it.  `: "${VAR:=value}"` keeps an explicit environment
# override winning, which is how a one-off experiment stays out of the profile.
#
# Pick a profile on a box with: LLM_HOST_PROFILE=<id> in ~/.bashrc, or the id on a
# line in ~/.llm/host-profile.  Detection covers this file's own box.
# ==============================================================================

TAC_HOST_PROFILE_ID="intel-xe-cuda"
TAC_HOST_PROFILE_DESCRIPTION="Intel i9 / Iris Xe iGPU / RTX 3050 Ti 4 GB (WSL2 x86_64)"
TAC_HOST_PROFILE_ARCH="x86_64"
TAC_HOST_PROFILE_CUDA=1
TAC_HOST_PROFILE_RENDER=1
TAC_HOST_PROFILE_XE=1

# ---- CI arm -----------------------------------------------------------------
# The runner label this box answers in the per-box CI matrix (tools/ci-boxes.sh).
# ENABLED=0 retires the arm without deleting this profile's tuning — set to 0 on
# 2026-11-19 while wsl-console-1 (on the XPS 15) was offline and unreachable: a
# literal [ARM64, X64] matrix left every X64 job queued forever, so run 44512057230
# could never conclude. Re-enable in one line when that box is back.
TAC_HOST_CI_BOX="X64"
TAC_HOST_CI_BOX_ENABLED=0

# ---- Model store -------------------------------------------------------------
# The GGUF store is a BIND MOUNT on this box, so an absent mount is the failure to
# catch — and the dirs are the derived <root>/active + <root>/archive pair.
TAC_HOST_PROFILE_MODEL_STORE_IS_MOUNT=1
: "${LLAMA_DRIVE_ROOT:=/mnt/m}"

# ---- Memory model ------------------------------------------------------------
# The card has its own 4 GiB; nothing is shared with system RAM.
TAC_HOST_PROFILE_SHARED_MEMORY=0

# ---- Autotune probe ceiling (2026-11-25) --------------------------------------
# The highest context an autotune probe may test on this box, per box — the same fact
# the ASUS conf declares at 262144, stated here rather than inherited from shared code,
# because a ceiling is a fact about a machine (Wayne, 2026-11-18: "keep commonality
# shared; each box supplies its own facts").  A 4 GiB card cannot back a window this
# box's lane serves anyway: systemd/llama-xe-minicpm5-1b-chat.service runs --ctx-size
# 65536, and the KV math against 4 GiB already lands far below it.  Declared so a box
# whose lane grows can raise one number, and so the parity gate compares it.
: "${LLAMA_MAX_PROBE_CTX:=65536}"

# ---- Tuning defaults ---------------------------------------------------------
# Keep the baseline offload under this card's 4 GB.
: "${LLAMA_GPU_LAYERS:=24}"
# Six P-cores; 01-constants caps this by nproc, so a smaller VM is never told to
# run six.
: "${LLAMA_CPU_THREADS_BASE:=6}"
# The hybrid-core ceiling __llm_thread_cap enforces: a seventh compute thread spills
# decode onto the E-cores and slows generation (SPEC-DEC-002).  A homogeneous box
# declares 0 — no ceiling — in its own profile.
: "${LLAMA_THREAD_CAP:=6}"
: "${LLAMA_FIT_TARGET_MB:=1024}"
# Host-RAM tier of llama.cpp's prompt cache.  0 is explicit-disable; the one
# MEASURED per-lane budget is below and is repeated as the literal --cache-ram in
# the lane's unit (tests/unit/23 pins the two together).
: "${LLAMA_CACHE_RAM_MB:=0}"
# `${arr+x}` tests element 0, which this sparse map does not have; `declare -p` is
# the reliable "already declared" test for an associative array.
if ! declare -p LLAMA_CACHE_RAM_MB_BY_PORT >/dev/null 2>&1
then
    declare -gA LLAMA_CACHE_RAM_MB_BY_PORT=(
        [18085]=768   # Xe 3B — 640 MiB re-prefills, 768 MiB hits (2026-10-22)
    )
fi
# Fallback only: the card is asked first.  This is this card's 4 GiB.
: "${VRAM_TOTAL_BYTES_FALLBACK:=4294967296}"

# ---- Build tree --------------------------------------------------------------
# The CUDA build is build/ here, so LLAMA_BUILD_DIR stays unset and llm-build's default
# stands.  Declared CUDA architecture, used only when nvidia-smi cannot answer: the
# RTX 3050 Ti is Ampere GA107, compute 8.6 (sm_86).
: "${LLAMA_CUDA_ARCH:=86}"

# ---- Quantisation policy -----------------------------------------------------
# The ratings were written for a 4 GB card; a larger card must not inherit them.
: "${LLAMA_QUANT_GUIDE_REL:=config/quant-guide.conf}"

# ---- Resident lanes ----------------------------------------------------------
# unit|port.  Each unit is marked `# install-profile: intel-xe-cuda`, so install.sh
# links these five on this box and none of them on another.  tests/unit/23 pins
# this table against the units' own ExecStart lines.
: "${LLAMA_LANE_SPECS:=llama-xe-minicpm5-1b-chat.service|18081
llama-xe-embeddinggemma-embed.service|18080
llama-xe-llama32-3b-chat.service|18085
llama-cuda-llama32-3b-chat.service|18083
llama-cpu-qwen25-3b-chat.service|18084}"
# The gated (GPU-suspendable) lane — the one the autotune/bench wrappers suspend and
# the watchdog treats as CUDA-gated.  The other four lanes are always-on.
: "${LLAMA_CUDA_LANE_UNIT:=llama-cuda-llama32-3b-chat.service}"
# The gated lane is the CUDA 3B tier here, not the Xe or CPU lane: LLM_SERVICE_PORT
# above is the PRIMARY lane (18081, Xe), which is a different device (v16).
: "${LLAMA_CUDA_LANE_PORT:=18083}"
# The lane `so` treats as the production server (the gateway's baseUrl target), and
# its UNIT name for the messages that name it.
: "${LLM_SERVICE_PORT:=18081}"
: "${TAC_HOST_PRIMARY_LANE:=llama-xe-minicpm5-1b-chat.service}"

# The model the fleet must RETURN to — the name bin/fleet-model.sh prints when a sweep's
# restore slot cannot answer.  This box's CUDA row, NOT the arm64 box's
# cuda-qwen3coder-30b: that provider does not exist here, so the old hardcoded constant
# told this box's operator to set a model it has never served (measured 2026-11-16).
# `fleet-model.sh status` reads it through the profile, so each box names its own.
: "${TAC_HOST_BASELINE_MODEL:=cuda-llama32-3b/llama32}"

# ---- Labels ------------------------------------------------------------------
: "${TAC_HOST_GPU_LABEL:=RTX 3050 Ti}"
: "${TAC_HOST_IGPU_LABEL:=Intel Xe}"

# ---- GPU inventory -----------------------------------------------------------
# TWO devices, and they are not interchangeable.  The RTX 3050 Ti is the CUDA card the
# llama-cuda-* lanes use (4 GiB); the Intel Xe is the iGPU the llama-xe-* lanes reach
# through /dev/dri + OpenCL and it has no VRAM of its own.  The Xe is INVISIBLE to
# nvidia-smi — this is a WSL guest, where lspci reports only Microsoft's virtual render
# driver and the iGPU arrives as a DRI render node — so no card probe can derive it.
# The count is therefore a profile fact, and it is what a "one card" assumption in
# shared code gets wrong (measured 2026-11-18: TAC_HOST_PROFILE_XE=1 existed, but
# nothing stated how many devices that meant).
: "${TAC_HOST_GPU_COUNT:=2}"
# Which nvidia-smi device the CUDA lanes use.  Declared because tac_host_gpu_pool_bytes
# now REFUSES to choose when nvidia-smi lists several devices.
: "${TAC_HOST_CUDA_GPU_INDEX:=0}"

# ---- OpenCL (Xe) build lane --------------------------------------------------
# This box serves the Intel Xe through OpenCL, so llm-build owns that tree too: the Xe
# lanes execute ${LLAMA_OPENCL_DIR}/bin/llama-server, and before 2026-11-18 that tree was
# a hand configure from a ~/llama-src tarball that no forward ever refreshed.
#   ENABLE  the switch. 0 on a CUDA-only box, so the builder grows no OpenCL step there.
#   DIR     the tree the Xe launcher already resolves.  It must be the FINAL name: the
#           RPATH pins the configure path, so a tree configured elsewhere cannot be moved
#           into place.
#   ADRENO  0 = do not grab the iGPU with Adreno kernels; three lanes already share it.
#   TARGET  OpenCL target version the Xe driver reports (300 here).
: "${LLAMA_OPENCL_ENABLE:=1}"
: "${LLAMA_OPENCL_DIR:=$HOME/llama.cpp/build-opencl}"
: "${LLAMA_OPENCL_ADRENO:=0}"
: "${LLAMA_OPENCL_TARGET:=300}"

# end of file
