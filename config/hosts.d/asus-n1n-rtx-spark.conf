# ==============================================================================
# asus-n1n-rtx-spark.conf — the ASUS arm64 box (N1N RTX Spark, WSL2).
# ==============================================================================
# A HOST PROFILE: the per-machine half of this repo.  This box shares the code
# with `intel-xe-cuda` and shares NOTHING else — its GPU, its model store and its
# resident lanes are its own.
#
# What is stated here is what is established.  What is not established is left
# UNSET on purpose, so the generic default applies and the first measurement on
# the box fills it in — a number invented here would become a tuning value nobody
# ever checked.  In particular:
#   * no QUANT GUIDE: the shared guide's ratings were written for a 4 GB card and
#     would auto-archive quants that fit here.  `model download`/`model scan` run
#     unrated until this box has a guide of its own (set LLAMA_QUANT_GUIDE_REL).
#   * no resident LANES: a lane unit names a specific GGUF file and port.  This
#     box's model set is not in the repo, so no lane is claimed; `model scan`
#     registers its models and lanes are added when they are named.
#   * RENDER is not declared: whether this SoC exposes a render node is not
#     established, so the profile matches without caring either way.
# ==============================================================================

TAC_HOST_PROFILE_ID="asus-n1n-rtx-spark"
TAC_HOST_PROFILE_DESCRIPTION="ASUS arm64 / N1N RTX Spark, CUDA (WSL2 aarch64)"
TAC_HOST_PROFILE_ARCH="aarch64"
TAC_HOST_PROFILE_CUDA=1
TAC_HOST_PROFILE_XE=0

# ---- Model store -------------------------------------------------------------
# This box's GGUF store.  Left at the shared default until it is set here or in
# the box's own ~/.bashrc / ~/.llm/host-profile environment.
# : "${LLAMA_DRIVE_ROOT:=/mnt/m}"

# ---- Tuning defaults ---------------------------------------------------------
# Offload everything and let the card decide: 999 is this repo's "all layers"
# idiom at launch, and there is no small-VRAM ceiling to stay under here.
: "${LLAMA_GPU_LAYERS:=999}"
# Empty = derive from nproc (half), because this box's core count is not the i9's.
: "${LLAMA_CPU_THREADS_BASE:=}"
: "${LLAMA_FIT_TARGET_MB:=1024}"
: "${LLAMA_CACHE_RAM_MB:=0}"

# ---- Sizing fallback ---------------------------------------------------------
# 0 = UNKNOWN.  There is no honest constant for a card this repo has never
# measured; callers treat 0 as "no reading" and say so instead of sizing against
# a guess.  `model scan`/`model bench` re-read the card once it answers.
: "${VRAM_TOTAL_BYTES_FALLBACK:=0}"

# ---- Quantisation policy -----------------------------------------------------
# Empty = no guide on this host (see the header).
: "${LLAMA_QUANT_GUIDE_REL:=}"

# ---- Resident lanes ----------------------------------------------------------
# Empty on purpose (see the header).  `model lanes` reports none rather than
# ports nothing here can bind.
: "${LLAMA_LANE_SPECS:=}"

# ---- Labels ------------------------------------------------------------------
: "${TAC_HOST_GPU_LABEL:=N1N RTX Spark}"

# end of file
