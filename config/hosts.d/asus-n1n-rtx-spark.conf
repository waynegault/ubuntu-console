# ==============================================================================
# asus-n1n-rtx-spark.conf — the ASUS ProArt P16 arm64 box (RTX Spark N1X, WSL2).
# ==============================================================================
# A HOST PROFILE: the per-machine half of this repo.  This box shares the code
# with `intel-xe-cuda` and shares NOTHING else — its GPU, its model store and its
# resident lanes are its own.
#
# MEASURED 2026-10-30 over SSH from the XPS 15 (`ssh proart`, hostname
# ProArt-P16, aarch64, Ubuntu 26.04.1 under WSL2 kernel 6.18.54.1-microsoft-standard):
#   * 20 CPUs, 39 GiB RAM (`free -g`), 898 GiB free on / (1007 GiB).
#   * `nvidia-smi`: "NVIDIA RTX Spark N1X (6144-core Blackwell RTX GPU)",
#     81920 MiB reported, compute capability 12.1, driver 621.01.
#   * /dev/dri AND /dev/dxg both present; nvidia-smi resolves to
#     /usr/lib/wsl/lib/nvidia-smi (reached through ~/.npm-global/bin).
#   * /mnt/nas mounted (Public, wayne) but NO *.gguf store on it to depth 3, and no
#     /mnt/m.  The box's own models live at ~/models — 18 G, ONE file
#     (Qwen3-Coder-30B-A3B-Instruct-Q4_K_M.gguf) in a FLAT layout, NOT the
#     <root>/active + <root>/archive the repo's LLAMA_MODEL_DIR derives from.
#     ~/.llm is empty (no models.conf).
#   * llama.cpp at measurement: only ~/llama.cpp/build-cpu (native aarch64, 0.8.0-dev
#     build 1), no CUDA build, so no CUDA lane could start.  SUPERSEDED 2026-11-03:
#     `build-cuda/` is the only tree left, configured with
#     /usr/local/cuda-13.4/bin/nvcc and linking libcudart/libcublas .so.13 from
#     /usr/local/cuda-13.4/lib64 plus libcuda.so.1 from /usr/lib/wsl/lib, and both
#     CUDA lanes serve from it.
#   * A HAND-WRITTEN lane existed OUTSIDE this repo, in ~/.config/systemd/user/:
#     llama-cpu-qwen3coder-30b-chat.service — port 18086, build-cpu, that GGUF,
#     --threads 12, --ctx-size 24576, MemoryMax=30G.  At measurement it was in
#     `failed` state, having been STOPPED at 01:11 while still processing a ~17k
#     prompt: SIGTERM was ignored, systemd's stop timed out and it was SIGKILLed.
#     That is a stop-path fact, not a start failure — and the unit is not managed
#     by this repo at all.  REMOVED 2026-11-03 with the rest of the CPU tier:
#     `llama.cpp/build-cpu/` no longer exists, the unit and its backups are gone,
#     and the gateway's `cpu-qwen3coder-30b` / `cpu-qwen25-3b` providers were
#     removed from openclaw.json (both pointed at dead ports).  One serving stack
#     on this box: llama.cpp CUDA under WSL.
#   * ~/github-wsl/ubuntu-console exists at d28b053f — 1397d464 plus ONE unpushed local
#     commit — and PREDATES this profile layer (no config/hosts.d).  A pull is
#     needed before anything here takes effect.
#
# What is stated below is what is established.  What is not established is left
# UNSET on purpose, so the generic default applies rather than a number invented
# here.  Still open:
#   * MODEL STORE: DECIDED 2026-10-30 — the profile names the flat store directly
#     (LLAMA_MODEL_DIR=~/models) instead of reshaping the box's files to the repo's
#     <root>/active convention.  `mountpoint` is the wrong test for a plain directory,
#     so MODEL_STORE_IS_MOUNT=0 and readiness is "the directory exists".
#   * MEMORY MODEL: SHARED_MEMORY=1 (the GPU's memory IS the system pool), but the
#     POOL IS MEASURED PER BOOT and is NOT physical RAM.  Corrected 2026-11-03: the
#     2026-10-30 decision ("size against physical RAM, never the card's figure") came
#     from one boot's numbers and is wrong.  Measured across two boots: 2026-11-02
#     23:43 gave card 81920 MiB with Windows seeing 46.5 GB; 2026-11-03 01:50 gave
#     card 98304 MiB with Windows seeing 30.5 GB — the OS/GPU split is made at boot
#     and MOVES by ~16 GiB.  On that second boot torch reported 110.5 GiB, ABOVE the
#     card, so the card is the conservative bound of the two.  11d reads the card (or
#     TAC_HOST_GPU_POOL_BYTES, exported by tools/host-profile.sh once per boot) and no
#     longer clamps it to MemTotal, which is itself only a .wslconfig value.
#   * QUANT GUIDE: the shared guide's ratings describe a 4 GB card and would
#     auto-archive quants that fit here, so this box runs unrated until it has a
#     guide of its own (set LLAMA_QUANT_GUIDE_REL).
#   * RESIDENT LANES: a lane names a specific GGUF file and port.  This box's
#     model set is not in the repo, so no lane is claimed; `model scan` registers
#     the models and lanes are added when they are named.
#   * VRAM vs RAM: the card's figure is the sizing bound; guest MemTotal is not.
#     The fallback stays 0 because the card answers — a constant would be a second
#     guess and would go stale at the next boot's re-split.
# ==============================================================================

TAC_HOST_PROFILE_ID="asus-n1n-rtx-spark"
TAC_HOST_PROFILE_DESCRIPTION="ASUS ProArt P16 arm64 / RTX Spark N1X (Blackwell, compute 12.1), CUDA (WSL2 aarch64)"
TAC_HOST_PROFILE_ARCH="aarch64"
TAC_HOST_PROFILE_CUDA=1
TAC_HOST_PROFILE_XE=0
# DEVICE-INDEPENDENT IDENTITY (2026-11-04).  Detection used to need the GPU, and a CI
# runner in a bare environment reads cuda=0 (no nvidia-smi, no device node) — measured on
# this box, where install.sh then refused to install and three BATS cases failed.  The CPU
# model is readable through lscpu with no device access, so it identifies the box instead
# and the CUDA/XE facts below become descriptive.  Matched case-insensitively as a
# substring; `lscpu` on this box reports "Cortex-X925".
TAC_HOST_PROFILE_CPU="Cortex-X925"

# ---- Model store -------------------------------------------------------------
# A PLAIN DIRECTORY, not a bind mount (see the header).  The box uses the repo's
# <root>/active + <root>/archived convention, not the flat layout first assumed
# (reversed 2026-11-01: the files sit in active/ and archived/).
TAC_HOST_PROFILE_MODEL_STORE_IS_MOUNT=0
: "${LLAMA_DRIVE_ROOT:=$HOME/models}"
: "${LLAMA_MODEL_DIR:=$HOME/models/active}"
: "${LLAMA_ARCHIVE_DIR:=$HOME/models/archived}"
# HuggingFace's home AND hub cache live in the store too (Wayne, 2026-11-02), so a
# download and the GGUF it becomes sit in one place instead of $HOME/hf_cache.  Both
# point at active/ itself, so HF's `models--*` dirs, blobs and .locks land BESIDE the
# GGUFs rather than under a hub/ subdir; nothing reads this dir but a non-recursive
# `*.gguf` glob (11e-llm-model.sh:248), so the model listing is unaffected.  The
# global HF_HOME default is ~/hf_cache in 01-constants.sh:526 with `:-`, and this
# profile is applied before it, so these values win on this box and a box whose
# profile declares neither keeps its own.
: "${HF_HOME:=$HOME/models/active}"
: "${HF_HUB_CACHE:=$HOME/models/active}"

# ---- Registry & tool state ---------------------------------------------------
# The registry lists the ACTIVE models, so it lives beside them in active/; the
# rest of the tool state (default pointer, bench TSVs, autotune logs, backups)
# lives in the store's .llm/ dir (see ~/models/README.md: ".llm/  tool state,
# not models").  Both remain overridable knobs, so a fixture still pins its own.
: "${LLM_REGISTRY:=$HOME/models/active/models.conf}"
: "${LLM_STATE_DIR:=$HOME/models/.llm}"

# ---- Memory model ------------------------------------------------------------
# Unified, and the POOL is measured per boot — never clamped to RAM (see the header;
# corrected 2026-11-03 after two boots measured 16 GiB apart).
TAC_HOST_PROFILE_SHARED_MEMORY=1

# ---- Tuning defaults ---------------------------------------------------------
# Offload everything and let the card decide: 999 is this repo's "all layers"
# idiom at launch, and there is no small-VRAM ceiling to stay under here.
: "${LLAMA_GPU_LAYERS:=999}"
# Empty = derive from nproc (half — 10 on this box's 20 CPUs), because this core
# count is not the i9's and a fixed 6 would leave most of it idle.
# NOTE (verified 2026-11-10 via Windows Win32_Processor L2CacheSize=25600 KB &
# NVIDIA DGX Spark / GB10 guidance): physically the N1X SoC has 10x Cortex-X925
# (2 MB L2) + 10x Cortex-A725 (512 KB L2), which Hyper-V masks as 20x 0xd85 in
# /proc/cpuinfo while Windows Thread Director schedules the first 10 active
# threads onto the 10 X925 cores.  So nproc/2 = 10 matches the 10 X925 cores.
: "${LLAMA_CPU_THREADS_BASE:=}"
# 0 = NO CEILING in __llm_thread_cap (pinned by 74-host-profiles.bats and E2E
# contracts); __calc_threads and models.conf target 10 threads (the 10 X925 cores).
: "${LLAMA_THREAD_CAP:=0}"
: "${LLAMA_FIT_TARGET_MB:=1024}"
: "${LLAMA_CACHE_RAM_MB:=0}"

# ---- Sizing fallback ---------------------------------------------------------
# 0 = UNKNOWN, and it stays 0 because the card answers: a constant here would go stale
# at the next boot's re-split (81920 MiB then 98304 MiB, 16 GiB apart — see the header).
# Callers treat 0 as "no reading" and say so instead of sizing against a guess.
: "${VRAM_TOTAL_BYTES_FALLBACK:=0}"

# ---- Quantisation policy -----------------------------------------------------
# Empty = no guide on this host (see the header).
: "${LLAMA_QUANT_GUIDE_REL:=}"

# ---- Resident lanes ----------------------------------------------------------
# The two lanes that serve this box.  Each names a GGUF file in ~/models/active and
# a port.  The chat lane is the gated lane (LLAMA_CUDA_LANE_UNIT below); the
# embedding lane is always-on (memory search must not be evicted by a bench, a
# GPU-busy stop, or `model use` claiming the card).  The CPU tier
# (llama-cpu-qwen3coder-30b-chat) is DELIBERATELY not listed — the old Intel-Xe
# tier did not survive the arm64 move, and that unit is disabled here, so the
# watchdog must not try to start it.
: "${LLAMA_LANE_SPECS:=llama-cuda-qwen3coder-30b-chat.service|18087
llama-cuda-qwen3embedding-embed.service|18080
llama-cuda-qwen25-3b-measure.service|18089}"
# Lanes that a VRAM-drain must NOT stand down.  The embedding lane backs memory search
# and is always-on: evicting it to free ~0.5 GB would break a different subsystem to save
# memory the autotune's baseline tolerance already absorbs.  The chat lane is deliberately
# absent — autotuning a 70B needs the whole card, so it IS stood down, with a message
# naming the unit (measured 2026-11-02: `model autotune 2` refused with 28099 MiB held
# because the protected chat lane was serving :18087 at -ngl 99).
: "${LLAMA_LANE_KEEP_UNITS:=llama-cuda-qwen3embedding-embed.service}"
export LLAMA_LANE_KEEP_UNITS
# The CUDA lane the autotune/bench/probe wrappers suspend.  This box serves
# Qwen3-Coder-30B on the CUDA card, so the lane is the qwen3coder unit — the
# scripts' default (llama-cuda-llama32-3b-chat) is the OLD box's lane and would
# leave the card held while a wrapper waits for it to free.
: "${LLAMA_CUDA_LANE_UNIT:=llama-cuda-qwen3coder-30b-chat.service}"
# The production lane `so` / `oc health` probe (the gateway's local baseUrl target)
# and its unit name for the messages that name it.  This box serves Qwen3-Coder-30B
# on the CUDA card (:18087), not the OLD box's Xe MiniCPM lane (:18081) — left
# unset, the generic 18081 default made `oc health` warn "LLM port 18081 not
# listening" on a healthy box.
: "${LLM_SERVICE_PORT:=18087}"
: "${TAC_HOST_PRIMARY_LANE:=llama-cuda-qwen3coder-30b-chat.service}"
# The "card is free" threshold the autotune/bench wrappers wait for.  The 800 MiB
# default is the OLD box's driver overhead; this Blackwell driver reserves ~2.9 GiB
# with no process attached, so a lower bound never satisfies and the wrappers abort.
: "${LLAMA_GPU_FREE_THRESHOLD_MIB:=3500}"
# Same driver-overhead bound for the ROW script's EXCLUSIVE-mode guard (its own
# variable, same ~2.9 GiB reservation): total-free must sit within this of zero.
#
# RESOLVED 2026-11-05 (owner decision, card AUTOTUNE-BASELINE-002): this box runs the
# CENSUS below, not this bound.  The conflict it recorded was real — the guard runs
# AFTER __llm_stand_down_cuda_lanes, which never stops a unit in LLAMA_LANE_KEEP_UNITS
# (here the embedding lane), so the measured gap (4094 MiB) exceeded 3500 and every
# autotune/bench aborted before its first row.  Raising the bound was rejected: it
# silently admits a real serving lane.  The census names the tenant that may stay and
# caps the whole hold, and a census pass is recorded as CONTENDED.  The value below
# stays as the exclusive-mode bound for a box with no census.
: "${LLM_AUTOTUNE_BASELINE_GAP_MAX:=3500}"
# THE CENSUS (declared allowance).  Identity is the PROCESS TABLE, not nvidia-smi:
# `nvidia-smi --query-compute-apps` answers "No running processes found" on this
# WSL2 box even at 36 GiB used, so only the process scan can name a tenant.  Every
# resident llama-server must match one of these names by its LEAF systemd unit (or,
# weaker, by its exe basename); anything else refuses the run.
#
# The cap is the WHOLE-CARD gap (driver + tenants), not a per-lane figure.
#
# MEASURED 2026-11-05 17:54 GMT (18:54 BST) with ONLY the kept lane resident — the
# stray 120B `model use` on :8081 stopped first, the embedding lane serving:
#   total 73,728 MiB, free 72,322 MiB  ->  gap 1,406 MiB
# That is the driver plus Qwen3-Embedding-0.6B at 8192 ctx.  The earlier 6144 was an
# ESTIMATE derived from a both-lanes-resident reading (36,147 MiB used); it was 4x
# the real hold and this measurement supersedes it (and is itself superseded below).
# 3072 left ~1.7 GiB for an
# embed request under load and per-boot driver variance, and stays an order of
# magnitude below the ~31 GiB a serving chat lane holds — so that lane can never
# pass.  Re-derive it from a run's own "pools:" line after a carve or lane change;
# do not raise it without re-measuring.
: "${LLM_AUTOTUNE_CENSUS:=llama-cuda-qwen3embedding-embed.service}"
# RE-DERIVED 2026-11-06 13:26Z after the Creator Hub carve changed 4 GiB -> 24 GiB.
# The 3072 above was measured on a 73,728 MiB pool, where the WDDM reservation
# plus the kept embed lane read as a 1,406 MiB gap.  The driver reservation
# scales with the pool, and at 24,576 MiB the same tenants measure a 4,371 MiB
# gap (only the embed lane resident, chat lane stopped).  Cap = 4,371 + ~1.7 GiB
# headroom for an embed request under load = 6144.  Re-derive again on any carve
# change; a cap below the real gap makes every batch abort before row one.
: "${LLM_AUTOTUNE_CENSUS_MAX_MIB:=6144}"
# The CUDA llama-server the autotune/bench measure with.  There is no unified
# build/bin here — the CUDA build is build-cuda (and the CPU build build-cpu).
: "${LLAMA_CUDA_SERVER_BIN:=$HOME/llama.cpp/build-cuda/bin/llama-server}"

# ---- Build tree --------------------------------------------------------------
# `llm-build` rebuilds THIS tree, not build/.  It is the tree the line above serves, so
# a rebuild replaces the binary both lanes launch.  Left unset, the rebuild landed in
# build/ and the run only warned that the launcher resolved a different path.
: "${LLAMA_BUILD_DIR:=$HOME/llama.cpp/build-cuda}"
# Declared CUDA architecture for Blackwell GB10 / RTX Spark N1X (compute 12.1):
# `121a-real` compiles architecture-accelerated sm_121a Tensor Core kernels directly
# without PTX bloat (per NVIDIA DGX Spark llama.cpp guidance).
: "${LLAMA_CUDA_ARCH:=121a-real}"
# Compile all FlashAttention quant pairs (GGML_CUDA_FA_QUANTS=all, the upstream
# replacement for the deprecated GGML_CUDA_FA_ALL_QUANTS=ON).
: "${LLAMA_CUDA_FA_QUANTS:=all}"

# ---- Labels ------------------------------------------------------------------
# The measured card name, not a guess: `nvidia-smi --query-gpu=name` on this box.
: "${TAC_HOST_GPU_LABEL:=RTX Spark N1X}"

# end of file
