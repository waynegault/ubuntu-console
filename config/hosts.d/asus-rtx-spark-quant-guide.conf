# ==============================================================================
# asus-rtx-spark-quant-guide.conf — Quantization Priority Guide (128GB Unified)
# ==============================================================================
# Purpose:    Guides model download and scan evaluation on the ASUS ProArt P16
#             (RTX Spark N1X — 128 GB unified LPDDR5X memory).
# Format:     Lines starting with # are comments. Blank lines ignored.
#             rating|quant_pattern|description
# ==============================================================================

# ── Recommended (High-precision quants supported on 128GB unified memory) ────
recommended|Q8_0|8-bit: Near-lossless quality with high throughput on unified memory
recommended|Q6_K|6-bit K-quant: Optimal quality/size trade-off for 30B-70B models
recommended|Q5_K_M|5-bit K-quant: Fast execution with negligible degradation
recommended|F16|Full half-precision: Ideal for embeddings and models up to 35B

# ── Acceptable (Balanced 4-bit / 3-bit quants for massive 70B-123B models) ──
acceptable|Q4_K_M|4-bit: Usable when conserving memory for massive contexts or 70B+ models
acceptable|Q4_K_S|4-bit small: Compact footprint for large parameter models
acceptable|Q3_K_M|3-bit medium: Acceptable for 100B+ parameter models
acceptable|Q3_K_L|3-bit large: Acceptable for 100B+ parameter models
acceptable|IQ3_M|iQuant Q3 medium: Acceptable for very large models
acceptable|IQ3_XXS|iQuant Q3 extra-small: Acceptable only for massive models

# ── Discouraged (Unnecessary quality loss or inefficient representations) ────
discouraged|Q2_K|2-bit: Unnecessary quality degradation on 128GB unified memory
discouraged|Q3_K_S|3-bit small: Low quality quantization unnecessary on 128GB unified memory
discouraged|F32|Double precision: Double memory usage with zero inference benefit
discouraged|BF16|Brain float 16: Inefficient quantization representation for ggml

# end of file
