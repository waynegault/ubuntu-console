name: Nightly Full Suite

on:
  schedule:
    # 3:23 AM UTC daily — off the :00/:30 marks to spread load
    - cron: '23 3 * * *'
  workflow_dispatch:

jobs:
  full-suite:
    name: Full BATS + Python Suite
    runs-on: [self-hosted, wsl-console]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install bats
        run: |
          sudo apt-get update
          sudo apt-get install -y bats

      - name: Install shellcheck (pinned)
        run: sudo tools/install-shellcheck.sh

      - name: Run full behavioural suite
        # --print-output-on-failure on every bats invocation here: a failed
        # `run ...; [ "$status" -eq 0 ]` assertion otherwise prints only the failed line and
        # discards the captured output, which is where a script-under-test names the cause.
        # Verified 2026-09-18 with a two-arm control (markers absent without, present with).
        run: bats --print-output-on-failure tests/tactical-console.bats

      - name: Run fast + function-availability suites
        run: |
          bats --print-output-on-failure tests/tactical-console-fast.bats
          bats --print-output-on-failure tests/tactical-console-function-availability.bats

      - name: Run unit suites
        run: |
          # 04-llama-cpp-inventory.bats excluded: performs live downloads + mutates host
          bats --print-output-on-failure tests/unit/01-refresh-keys.bats \
               tests/unit/02-so-startup.bats \
               tests/unit/05-spec-dec-threads.bats \
               tests/unit/06-spec-dec-stats.bats \
               tests/unit/07-spec-dec-launch.bats \
               tests/unit/08-autotune-workload.bats \
               tests/unit/09-check-agent-use.bats \
               tests/unit/10-clean-orphans.bats \
               tests/unit/11-module-versions.bats \
               tests/unit/12-gpu-exclusivity.bats

      - name: Run integration suites
        run: |
          bats --print-output-on-failure tests/integration/01-maintenance.bats \
               tests/integration/02-model-lifecycle.bats \
               tests/integration/03-backup-restore.bats \
               tests/integration/04-watchdog.bats \
               tests/integration/05-refresh-keys.bats \
               tests/integration/e2e-bench-autotune.bats

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest pytest-timeout pydantic networkx
          pip install tree-sitter tree-sitter-bash tree-sitter-python

      - name: Ruff lint
        run: ruff check scripts/ tests/

      - name: Run Python tests
        run: python -m pytest tests/test_kgraph.py tests/test_kgraph_wiring.py tests/test_models.py tests/test_untested_modules.py tests/test_bats_lock_fixture.py -x --timeout=120 -q

      - name: Docs sync check
        run: tools/docs-sync-check.sh

# end of file
