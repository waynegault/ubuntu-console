name: Nightly Full Suite

on:
  schedule:
    # 3:23 AM UTC daily — off the :00/:30 marks to spread load
    - cron: '23 3 * * *'
  workflow_dispatch:

jobs:
  full-suite:
    name: Full BATS + Python Suite
    runs-on: [self-hosted, wsl-console]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install bats
        run: |
          sudo apt-get update
          sudo apt-get install -y bats

      - name: Install shellcheck (pinned)
        run: sudo tools/install-shellcheck.sh

      - name: Run full behavioural suite
        # --print-output-on-failure on every bats invocation here: a failed
        # `run ...; [ "$status" -eq 0 ]` assertion otherwise prints only the failed line and
        # discards the captured output, which is where a script-under-test names the cause.
        # Verified 2026-09-18 with a two-arm control (markers absent without, present with).
        run: bats --print-output-on-failure tests/tactical-console.bats

      # WHY THIS WORKFLOW IS NOT A SECOND COPY OF CI.  ci.yml runs, per push, the fast
      # suite, units 01/02/09/10/11 and 13-30, and every integration suite.  This
      # workflow used to repeat all of that and then add the full behavioural suite, so
      # most of its runtime re-proved what the same commit had already proved.  What is
      # left here is what ONLY the nightly can run: the full 387-case suite (20-35 min
      # on a loaded box, which is why it is not per push), the function-availability
      # suite, and the unit suites CI deliberately excludes — 05-08 (absent from CI's
      # list) and 12 (CI skips it because it takes the CUDA card lock this box shares
      # with the investigator).  Re-adding a suite here that ci.yml already runs is a
      # duplicate, not extra coverage.
      - name: Run the function-availability suite
        run: bats --print-output-on-failure tests/tactical-console-function-availability.bats

      - name: Run the unit suites CI excludes
        run: |
          # 04-llama-cpp-inventory.bats is excluded from BOTH workflows: it performs
          # live downloads and mutates the host.
          bats --print-output-on-failure tests/unit/05-spec-dec-threads.bats \
               tests/unit/06-spec-dec-stats.bats \
               tests/unit/07-spec-dec-launch.bats \
               tests/unit/08-autotune-workload.bats \
               tests/unit/12-gpu-exclusivity.bats

      # The integration suites are deliberately NOT repeated here: ci.yml runs
      # 01-maintenance, 02-model-lifecycle, 03-backup-restore, 04-watchdog,
      # 05-refresh-keys and e2e-bench-autotune on every push, on the same commit.

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest pytest-timeout pydantic networkx
          pip install tree-sitter tree-sitter-bash tree-sitter-python

      - name: Ruff lint
        run: ruff check scripts/ tests/

      - name: Run Python tests
        run: python -m pytest tests/test_kgraph.py tests/test_kgraph_wiring.py tests/test_models.py tests/test_untested_modules.py tests/test_bats_lock_fixture.py -x --timeout=120 -q

      - name: Docs sync check
        run: tools/docs-sync-check.sh

# end of file
