name: Secret Scan

# Kept in its own workflow rather than folded into ci.yml so it can be reviewed
# and rerun on its own, and so a secret finding is never buried among lint jobs.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# ── Which box is this? ─────────────────────────────────────────────────────────────
# The repo serves TWO boxes from one clone: an x86_64 Intel-Xe box and the arm64 RTX
# Spark box, with per-box lanes, model store and tuning in config/hosts.d/<id>.conf.
# A job whose verdict does not say WHICH box produced it is ambiguous — and a job that
# only works on one of them is a trap.  Every job therefore states its box from the
# repo's own resolvers (they refuse rather than guess), and FAILS if the profile cannot
# be resolved: a box-blind verdict is not a verdict.
x-box-step: &box_step
  name: Which box is this
  run: |
    set -uo pipefail
    source tools/host-profile.sh
    tac_host_profile_apply
    source tools/arch.sh
    box="$(hostname)"; arch="$(tac_host_arch)"
    printf 'box=%s arch=%s profile=%s matched=%s\n' \
      "$box" "$arch" "${TAC_HOST_PROFILE:-unresolved}" "${TAC_HOST_PROFILE_MATCHED:-0}"
    if [[ "${TAC_HOST_PROFILE_MATCHED:-0}" != 1 ]]; then
      echo "::error::no host profile resolved on ${box} (${arch}) — this job's expectations are per-box, so it must not run box-blind"
      exit 1
    fi

jobs:
  gitleaks:
    name: Secret Scan (gitleaks)
    runs-on: [self-hosted, wsl-console]
    timeout-minutes: 15
    steps:
      - *box_step
      - name: Checkout (full history — the scan needs every commit)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install gitleaks (pinned)
        run: sudo tools/install-gitleaks.sh

      - name: Scan history for secrets
        run: tools/secret-scan.sh --all
