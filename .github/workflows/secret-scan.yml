name: Secret Scan

# Kept in its own workflow rather than folded into ci.yml so it can be reviewed
# and rerun on its own, and so a secret finding is never buried among lint jobs.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  gitleaks:
    name: Secret Scan (gitleaks)
    runs-on: [self-hosted, wsl-console]
    timeout-minutes: 15
    steps:
      - name: Checkout (full history — the scan needs every commit)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install gitleaks (pinned)
        run: sudo tools/install-gitleaks.sh

      - name: Scan history for secrets
        run: tools/secret-scan.sh --all
