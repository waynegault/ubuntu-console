name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # workflow_dispatch is the second half of CI-PORTABILITY-001's non-push home for
  # the unit suite: the `python-unit` job below runs on PRs AND on a manual dispatch
  # (it is gated off `push`), so the suite can be run on demand without a push.
  workflow_dispatch:

# The CI verdict gate (inside tools/lint.sh) authenticates with ${{ github.token }} and reads
# GET /repos/<owner>/<repo>/actions/runs to decide whether the published tip is red.  The repo's
# DEFAULT workflow permission is "read" — which does NOT include actions:read — measured
# 2026-10-02: the gate got HTTP 403 ("Resource not accessible by integration") and FAILED BOTH
# jobs (run 37052712483), turning every push red (card CI-RED-001).  The explicit grant below is
# what lets the gate read the run list.  Keep actions:read if this block is ever changed, or the
# gate goes blind again and reports UNKNOWN.
permissions:
  contents: read   # actions/checkout
  actions: read    # the CI verdict gate's actions/runs query

# Job timeouts.  NO job here set one, so a hung job was bounded only by GitHub's default
# job timeout — 360 minutes, as the investigator's unittest.yml records (docs.github.com
# was unreachable when this was written, so that figure is second-hand and worth
# re-checking before it is relied on).  Six hours on a SINGLE self-hosted runner means every
# later push queues behind a hang — the "a run that never started" state that card
# CI-WATCH-CONSOLE-001 exists to make visible.  Each cap below is sized from a measured green
# run (2026-09-26, run 36272668820) with headroom, in the posture the investigator's
# unittest.yml states: cap generously, then tighten once a green run gives the real duration.
jobs:
  lint:
    name: Lint & Static Analysis
    runs-on: [self-hosted, wsl-console]
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install shellcheck (pinned)
        run: sudo tools/install-shellcheck.sh

      - name: Loader integrity guard
        run: |
          # Catch accidental corruption of the loader (e.g. terminal output
          # prepended to the file — see commit 3a7246a).
          first_line=$(head -1 tactical-console.bashrc)
          if [[ "$first_line" != "# shellcheck shell=bash" ]]; then
            echo "ERROR: tactical-console.bashrc first line is '$first_line'"
            echo "Expected: '# shellcheck shell=bash'"
            exit 1
          fi
          echo "Loader first-line OK"

      # ONE canonical invocation.  Three hand-rolled steps used to live here — a
      # `bash -n` loop, a shellcheck loop, and a `SKIP_UNICODE_CHECK=0 tools/lint.sh`
      # call — and the shellcheck loop had drifted from the others: it ran
      # `shellcheck -s bash "$f"`, WITHOUT `-x --source-path`, so CI analysed every
      # module STANDALONE.  That is the one analysis a sourced module cannot
      # satisfy: its interface is only visible alongside the modules that consume
      # it, so it reports SC2034/SC2154 for variables that are in fact used.  On
      # 2026-09-16 that made CI fail on a tree `tools/lint.sh` passed, and it went
      # unnoticed because it passed only by virtue of the file-wide disables that
      # the module-graph change removed.
      #
      # tools/lint.sh already covers a superset of all three steps — bash -n,
      # shellcheck per file PLUS the module graph as one set, the Unicode guards
      # (always-on dangerous-codepoint FAIL, advisory non-ASCII), and the repo
      # boundary guard — with the flags in exactly one place.  Calling it is the
      # point of that script; a second copy of the flags is what drifted.
      # GH_TOKEN here is the gate's AUTHENTICATION, not a convenience.
      # scripts/check_ci_status.py resolves gh without PATH (gh_binary), but gh otherwise
      # authenticates from the stored ~/.config/gh/hosts.yml of whoever owns the runner —
      # an external dependency that can expire or rotate.  When it does, the gate raises
      # UNKNOWN, exits 0, and this step prints "PASS CI verdict gate" while reading
      # nothing: the same blindness the gh-resolution fix closed, one layer down.
      # Scope needed: actions:read (the run list) + contents:read (repos/…/commits/<branch>).
      # Both are covered by this repo's default workflow permissions — "read", verified
      # 2026-09-27 via /repos/waynegault/ubuntu-console/actions/permissions/workflow.  If a
      # job-level `permissions:` block is ever added, keep actions:read or the gate goes
      # blind again (and will say so, as UNKNOWN).
      - name: "Lint & static analysis (canonical: tools/lint.sh)"
        env:
          GH_TOKEN: ${{ github.token }}
        run: tools/lint.sh

  test:
    name: Fast Test Suite
    runs-on: [self-hosted, wsl-console]
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install bats
        run: |
          sudo apt-get update
          sudo apt-get install -y bats

      # The fast suite's shellcheck tests skip when shellcheck is absent, so
      # install the same pinned version the lint job uses rather than no-op them.
      - name: Install shellcheck (pinned)
        run: sudo tools/install-shellcheck.sh

      # No count in this step's name: it read "62" while the suite had 64, and drifted twice in
      # one day. The count's authority is the README table, which tools/docs-sync-check.sh
      # gates; a number duplicated here can only drift.
      - name: Run fast tests
        # --print-output-on-failure: a failed `run ...; [ "$status" -eq 0 ]` assertion
        # otherwise prints the failed line and nothing else, discarding the captured output —
        # which for a script-under-test is where the cause is named.  Verified 2026-09-18 with
        # a two-arm control: without the flag the markers are absent, with it both streams print.
        run: bats --print-output-on-failure tests/tactical-console-fast.bats

      - name: Run lint script
        # Same GH_TOKEN reason as the lint job's canonical step: the CI verdict gate inside
        # tools/lint.sh must not depend on the runner owner's stored gh credential.
        env:
          GH_TOKEN: ${{ github.token }}
        run: tools/lint.sh

    # Full suite (387 tests) is run locally via: bats tests/tactical-console.bats
    # and nightly via .github/workflows/nightly.yml.

  docs-sync:
    name: Docs Sync Check
    runs-on: [self-hosted, wsl-console]
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify README matches repo facts
        run: tools/docs-sync-check.sh

  behavioral:
    name: Behavioral BATS (unit + integration)
    runs-on: [self-hosted, wsl-console]
    # Measured 735 s (12.3 min) on 2026-09-26 — the longest job on the push path, so this cap
    # is also the longest a hang can hold the single runner.
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install bats
        run: |
          sudo apt-get update
          sudo apt-get install -y bats

      - name: Run unit tests
        run: |
          # Fast smoke subset.  04-llama-cpp-inventory is excluded (live downloads +
          # host mutation).  12-gpu-exclusivity is excluded for the same reason ON A
          # SELF-HOSTED RUNNER: it takes the CUDA card lock, and this box also runs
          # investigator's GPU pipelines.  Measured 2026-09-18, a validation bench was
          # refused with "CUDA card is owned by another run" while a CI job held it — CI
          # must never be the reason a measurement is refused.  It still runs locally and
          # in any explicitly-listed run; it is not part of the nightly legacy suite.
          bats --print-output-on-failure tests/unit/01-refresh-keys.bats \
               tests/unit/02-so-startup.bats \
               tests/unit/09-check-agent-use.bats \
               tests/unit/10-clean-orphans.bats \
               tests/unit/11-module-versions.bats \
               tests/unit/13-gguf-ctx-bounds.bats \
               tests/unit/14-registry-identity.bats \
               tests/unit/15-secret-ref-paths.bats \
               tests/unit/16-docs-sync.bats \
               tests/unit/17-startup-notice-hold.bats \
               tests/unit/18-loopback0-unit.bats \
               tests/unit/19-telemetry-bg-notices.bats \
               tests/unit/20-up-npm-safety.bats \
               tests/unit/21-token-plan-quota-errors.bats \
               tests/unit/22-contracts-state.bats \
               tests/unit/23-prompt-cache-and-gpu-classify.bats \
               tests/unit/24-contracts-guards.bats \
               tests/unit/25-claimed-success-witness.bats \
               tests/unit/26-docker-prune.bats \
               tests/unit/27-gh-token-wrapper.bats \
               tests/unit/28-gh-keyring-watch.bats \
               tests/unit/29-errexit-arithmetic.bats \
               tests/unit/30-plugin-update.bats \
               tests/unit/31-stale-reap-safety.bats \
               tests/unit/32-report-rows-safety.bats \
               tests/unit/33-daemon-guard-patch.bats \
               tests/unit/34-contracts-falsification.bats \
               tests/unit/35-swallow-classify.bats \
               tests/unit/36-memory-index-check.bats \
               tests/unit/37-transcript-retention.bats \
               tests/unit/39-oc-restore-safety.bats \
               tests/unit/40-npm-cache-safety.bats \
               tests/unit/41-model-use-autotune-refusal.bats \
               tests/unit/42-commit-deploy-push-status.bats \
               tests/unit/43-count-ratchet-comments.bats \
               tests/unit/44-llm-build-cmake-status.bats \
               tests/unit/45-kgraph-hook-failure-report.bats \
               tests/unit/46-guarded-module-source.bats \
               tests/unit/47-capture-golden-fixtures.bats \
               tests/unit/48-error-handling-noise.bats \
               tests/unit/49-nas-backup-critical-config.bats \
               tests/unit/50-python-interpreter-resolution.bats

      - name: Run integration tests
        run: |
          bats --print-output-on-failure tests/integration/01-maintenance.bats \
               tests/integration/02-model-lifecycle.bats \
               tests/integration/03-backup-restore.bats \
               tests/integration/04-watchdog.bats \
               tests/integration/05-refresh-keys.bats \
               tests/integration/e2e-bench-autotune.bats

  module-count:
    name: Module Integrity
    runs-on: [self-hosted, wsl-console]
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Numbered modules discovered
        run: |
          count=$(ls scripts/[0-9][0-9]-*.sh | wc -l)
          echo "Found $count modules"
          [[ "$count" -gt 0 ]]

      - name: All modules have version comments
        run: |
          missing=0
          for f in scripts/[0-9][0-9]-*.sh scripts/09b-gog.sh; do
            [[ -f "$f" ]] || continue
            if ! grep -q '^# Module Version:' "$f"; then
              echo "MISSING version in $f"
              missing=$((missing + 1))
            fi
          done
          [[ "$missing" -eq 0 ]]

      - name: All modules have AI INSTRUCTION
        run: |
          missing=0
          for f in scripts/[0-9][0-9]-*.sh bin/*.sh; do
            [[ -f "$f" ]] || continue
            if ! grep -q 'AI INSTRUCTION' "$f"; then
              echo "MISSING AI INSTRUCTION in $f"
              missing=$((missing + 1))
            fi
          done
          [[ "$missing" -eq 0 ]]

      - name: All files end with newline
        run: |
          for f in tactical-console.bashrc install.sh env.sh \
                   scripts/[0-9][0-9]-*.sh bin/*.sh; do
            [[ -f "$f" ]] || continue
            if [[ "$(tail -c 1 "$f" | xxd -p)" != "0a" ]]; then
              echo "Missing trailing newline in $f"
              exit 1
            fi
          done

      - name: No carriage returns
        run: |
          for f in tactical-console.bashrc install.sh env.sh \
                   scripts/[0-9][0-9]-*.sh bin/*.sh; do
            [[ -f "$f" ]] || continue
            # Distinguish grep's three outcomes.  rc 1 is "no match", the expected
            # answer; rc >= 2 is a real error (unreadable file, bad pattern) and must
            # NOT be read as "no carriage returns" — the old `|| true` left the count
            # empty, and the arithmetic test below then passed vacuously.
            rc=0
            count=$(grep -Pc '\r' "$f") || rc=$?
            if [[ "$rc" -ge 2 ]]; then
              echo "grep failed (rc=$rc) while checking $f — cannot verify the no-CR invariant"
              exit 1
            fi
            if [[ "$count" -gt 0 ]]; then
              echo "Carriage returns found in $f"
              exit 1
            fi
          done

  python:
    name: Python Lint & Tests
    runs-on: [self-hosted, wsl-console]
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # The pinned Python toolchain lives in ONE file that every Python job installs, so
          # the per-push and nightly lanes cannot run different versions (card 49ab1c89). The
          # pins (ruff, pytest, pytest-timeout, mypy) and their reasoning are in
          # .github/ci-requirements.txt — bump them there, not here.
          pip install -r .github/ci-requirements.txt

      - name: Ruff lint
        run: ruff check .

      - name: Mypy
        # The repo requires mypy after any Python change, but CI never ran it — the
        # gap card 50cef401 records.  The interpreter is CI's python 3.12 while
        # pyproject targets 3.14; mypy is a static checker and targets the version in
        # the config regardless of the interpreter it runs under (verified 2026-10-02
        # in a python-3.12 venv holding only the CI dependency set).
        run: mypy

      - name: Run Python tests
        run: >-
          python -m pytest
          tests/test_kgraph.py tests/test_kgraph_wiring.py tests/test_models.py
          tests/test_call_flow.py tests/test_update.py tests/test_life_index.py
          tests/test_benchmark.py tests/test_mcp_server.py tests/test_pr_dashboard.py
          tests/test_validate.py tests/test_graph_server.py tests/test_report.py
          tests/test_cli.py tests/test_memory_import.py tests/test_projection.py
          tests/test_ast_extractor.py tests/test_kgraph_package.py
          tests/test_bats_lock_fixture.py tests/test_check_ci_status.py
          tests/test_oc_health_check.py tests/test_shell_command_scan.py
          -x --timeout=120 -q

  python-unit:
    name: Python Full Suite (PR / dispatch)
    # CI-PORTABILITY-001 (card 1fb62638) re-scoped the unit suite OFF the push lane:
    # its BATS-bridge files run the whole unit set, 66 cases of which are host-coupled
    # and cannot be green on this self-hosted runner yet, so a push must not pay for
    # them.  This job is that NON-PUSH home (PRs and workflow_dispatch, never push),
    # which is why `if` gates it; the `python` job above covers the fast, portable
    # subset on every push.
    #
    # It runs `pytest tests/` (testpaths in pytest.ini) rather than a hand-listed file
    # set, so a NEW tests/test_*.py is picked up with no workflow edit — the acceptance
    # in card 50cef401.  That same run covers the five files which previously ran
    # NOWHERE: test_bats_bridge.py, test_bats_unittest.py, test_kv_recall_probe.py,
    # test_oc_restart_check.py and test_grpo_vram_probe.py.  There is deliberately no
    # `-x`: stopping at the first failure would hide every later one.
    if: github.event_name != 'push'
    runs-on: [self-hosted, wsl-console]
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install bats
        run: |
          sudo apt-get update
          sudo apt-get install -y bats

      # The BATS-bridge suites call tools/lint.sh in places; install the pin so those
      # cases run instead of skipping on a missing shellcheck.
      - name: Install shellcheck (pinned)
        run: sudo tools/install-shellcheck.sh

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Same single source as the other Python jobs (card 49ab1c89).
          pip install -r .github/ci-requirements.txt

      - name: Run the full Python suite
        run: python -m pytest tests/ --timeout=120 -q

