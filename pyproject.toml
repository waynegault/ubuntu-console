# Repository-wide tool configuration for mypy and pyright.
# Checked Python sources are the ones the `files` list below names: the kgraph package
# and helpers under scripts/, the gates' own checkers and box tools under tools/, the
# suite under tests/ and the NAS/butler collectors under nas/.  bin/ is absent because
# it holds shell only — a .py there fails tools/lint.sh, which runs `bash -n` AND
# shellcheck over every bin/* entry (measured 2026-10-08, rc 2).
# Type-check everything with:
#   .venv/bin/python3 -m mypy            (or: mypy)
#   .venv/bin/pyright

[tool.mypy]
python_version = "3.14"
files = [
    "scripts/kgraph",
    "scripts/check_ci_status.py",
    "scripts/grpo-vram-probe.py",
    "scripts/kv-recall-probe.py",
    "scripts/oc-health-check.py",
    # The DIRECTORY, not its individual files: tools/ was outside every type checker
    # because only contracts_check.py and ratchet_check.py were named here, so the other
    # four — including the pytest-log recorder and the qwen-hooks scanner — could not be
    # checked at all.  Ten real errors were hiding there (nine of them from one
    # `dict[str, object]` annotation).  Naming the directory is what keeps a NEW tool
    # covered without a config edit; a file list is the shape that let the gap open.
    "tools",
    "tests",
    "nas",
]
# nas collectors import the shared lib as `lib.butler_common` (card 974f99ff); the
# scripts dir is on sys.path at run time, so mirror that for the type checkers.
mypy_path = ["stubs", "nas/butler/scripts"]
warn_unused_configs = true
show_error_codes = true
# Check the bodies of functions that carry no annotations.  Left off by default,
# so an unannotated helper's internals were never type-checked — mypy only
# printed an `annotation-unchecked` note and moved on.  Turning it on surfaced
# the errors fixed alongside this setting; it is not narrowed by any per-module
# override.
check_untyped_defs = true

# Optional third-party runtime deps that CI does not install, so `mypy` cannot
# resolve them there:
#   * torch and transformers — the GPU probe's deps (scripts/grpo-vram-probe.py
#     imports them inside the functions that need a card), hundreds of MB that a
#     lint job must not install;
#   * PyYAML — tools/contracts_check.py's contract parser (card dd96b63f moved that
#     program out of a shell heredoc, where no Python gate could see it).  It ships
#     no type information, so mypy needs types-PyYAML; requiring a stub package just
#     to lint the tool would add a dependency that checks nothing the tool does.
# paho-mqtt, pyusb and bleak (the NAS collectors' deps, run under /opt/bin/python3 on
# the NAS) are NOT listed here — they resolve through the in-repo stubs in `stubs/`,
# named by mypy_path below, so no `ignore_missing_imports` entry is needed for them.
# Declaring exactly these modules untyped keeps `mypy` a usable CI gate, while a
# missing import anywhere else is still an error.  Locally torch and transformers
# ARE installed and ship py.typed, so this override only changes their CI
# resolution — it does not stop checking them where they exist.
[[tool.mypy.overrides]]
module = ["torch", "transformers", "yaml.*"]
ignore_missing_imports = true

# NOTE (2026-10-09): pyright has no per-module import override, so the deps genuinely
# absent from this box (paho, usb, bleak) are resolved by the in-repo stubs in
# `stubs/`, wired in via extraPaths/stubPath below — `pyright` now exits 0.  It still
# emits reportMissingModuleSource WARNINGS for those stub-only packages (a stub with no
# source module beside it); the stubs are derived from the real call sites, and those
# warnings are reported rather than suppressed.
#
# pyright is deliberately NOT a CI gate — attempted 2026-10-09 and reverted the same day:
# the runner's `torch` is a PARTIAL stub, so `pyright` there reports ~12
# reportAttributeAccessIssue ERRORS in scripts/grpo-vram-probe.py that the real, py.typed
# torch on this box never raises. CI and local disagree on the same bytes, so a green local
# run says nothing about CI. The stubs are therefore validated LOCALLY only; before adding
# the gate, give CI a real torch — or scope the step to `nas/`, which imports none of it —
# and MEASURE on the runner rather than assuming local parity.
[tool.pyright]
# tools/ is named here for the same reason mypy's `files` names it: a DIRECTORY, so a new
# checker or box tool is covered without a config edit.  It was omitted while mypy's file
# list named two tools files by hand, so the same four files were invisible to both
# checkers.  Turning it on surfaced 19 findings — a `dict | None` helper contract, an
# optional sort key, three optional iterables and a `__doc__` read — none of them a live
# defect, all fixed at the source rather than narrowed away.
include = ["bin", "scripts", "tools", "tests", "nas"]
exclude = ["**/__pycache__", "**/frontend-g6/**", "scripts/build/**"]
pythonVersion = "3.14"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"
# tests/ import kgraph via a runtime sys.path insertion pyright cannot see.
# nas/butler/scripts is on sys.path at run time for the `lib.butler_common` import.
extraPaths = ["scripts", "nas/butler/scripts", "stubs"]
# In-repo stubs for the NAS runtime deps (paho, usb, bleak): absent from this
# box, so stubs are the only way both checkers see the code here.
stubPath = "stubs"
