# llama-cuda-ngram-mod.conf — enable ngram-mod speculative decoding on the CUDA chat lane.
#
# CARD: none (a measurement, not a defect)   MEASURED: 2026-11-18 11:07-11:13Z, ProArt-P16
#
# WHY THIS FILE EXISTS.
#   The lane had no speculative decoding of any kind.  The published 512K-context recipe's
#   --spec-type draft-mtp cannot be used here: the served Qwen3-Coder-30B-A3B file carries
#   ZERO nextn tensors (censused: `grep -aoc nextn` = 0, with blk.0.ffn_gate_exps found in
#   the same file as the positive control), so there is no MTP head to draft with.  ngram-mod
#   needs no draft model and no VRAM (~16 MB hash pool), which is the only speculation this
#   32 GiB card can afford against a 131072 context.
#
# MEASURED, on this lane's own argv, greedy, 2 prompts x 2 reps, tok/s generation:
#   baseline            66.43 / 67.19 (rewrite)      66.74 / 66.90 (explain)
#   --spec-type ngram-mod 77.06 / 120.77            65.41 / 158.46
#   draft acceptance 34-36% on the rewrite, 67% on the warm explain; a novel prompt drafted
#   nothing and gained nothing.  The gain is a WARM-POOL gain: re-emitting text already in
#   the pool, which is the fleet's edit loop.  docs/speculative.md's "MoEs require long
#   drafts" row (n-match 24 / n-min 48 / n-max 64) is exactly this build's compiled default,
#   so no tuning flags are added.
#
# THE COST, STATED.  Bit-identical greedy output is gone: baseline emitted the same sha on
#   both reps of both prompts, the ngram-mod arm differed on both rep-2 requests that
#   actually drafted (196 tokens where baseline used 223).  Accepted drafts are still
#   verified by the target model, so this is an argmax flip from batched verification, not
#   fabrication — but anything pinning exact model text will see different words.
#
# WHY A DROP-IN AND NOT AN EDIT.
#   Same shape as 60-ctx-fit-vram.conf: the unit's own command stays visible, the override
#   is one file, and deleting the file restores the committed behaviour.
#
#   THIS FILE REPEATS 60-CTX-FIT-VRAM.CONF'S ExecStart AND MUST CHANGE WITH IT.  systemd has
#   no "append a flag to the existing command"; a drop-in either adds to the list or (after
#   an empty `ExecStart=`) starts a new one.  Sorting after 60 means this line is the one
#   that runs.  If 60 is re-sized, this file carries the stale window — read BOTH files
#   before changing either.
#
# NOT CHANGED: -b 2048.  A sweep the same day put -b 8192 at +2.8% prefill for -2.3% of
#   generation (2712.78 -> 2788.08 prefill, 75.95 -> 74.18 tg, r=3), so the certified batch
#   stays.  That sweep also refuted the unit comment's 125-151 tok/s prefill: the lane does
#   2,050 tok/s over 14,622 tokens.
#
# VERIFIED AFTER ENABLING: /health 200, /props build_info b495-52975342f, n_ctx 131072,
#   4 slots, and the running argv carries --spec-type ngram-mod.
[Service]
ExecStart=
ExecStart=%h/.local/bin/llama-cuda-server -m %h/models/active/Qwen3-Coder-30B-A3B-Instruct-Q4_K_M.gguf --alias qwen3-coder-30b-gpu --port 18087 --host 127.0.0.1 --ctx-size 131072 --batch-size 2048 --ubatch-size 512 --threads 10 --parallel 4 --kv-unified --cache-ram 0 -ctk q8_0 -ctv q8_0 --flash-attn on --jinja --metrics -ngl 999 --spec-type ngram-mod

# install-dropin: llama-cuda-qwen3coder-30b-chat.service 61-ngram-mod.conf
