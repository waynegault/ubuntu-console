# quiet-fleet.conf — the pre-claim FLEET gate for the autotune resume loop.
#
# WHY (Wayne, 2026-10-19): "the autotune restart loop must require a QUIET FLEET (no live agent
# turns) in addition to a clear CI queue."  The loop's own gate covers this box's CI runners; this
# one covers agent turns, because a live turn and a measurement contend for the same CPU and make
# a row's position drift meaningless.
#
# The gate script is TRACKED here as bin/autotune-resume-quiet-gate.py (Wayne, 2026-10-19:
# "version the quiet-gate into ubuntu-console with a test").  It used to exist only as machine-local
# code at ~/.openclaw/bin/, where nothing could test it — and it then held the campaign for hours on
# three `session_windows` rows left `running` in September.  The staleness rule that fixes that is
# pinned by tests/unit/66-autotune-quiet-gate.bats, which is why the file lives in the repo.
#
# Install: install.sh installs this from the declaration below, which is this file's own
# destination (card SYSTEMD-DROPIN-INSTALL-001). The gate script is linked separately:
#   ln -sfn "$PWD/bin/autotune-resume-quiet-gate.py" "$HOME/.local/bin/autotune-resume-quiet-gate.py"
#   # then retire the untracked original so one source of truth remains:
#   ln -sfn "$PWD/bin/autotune-resume-quiet-gate.py" "$HOME/.openclaw/bin/autotune-resume-quiet-gate.py"
# install-dropin: autotune-resume.service quiet-fleet.conf
#
# A hand-install of the drop-in itself is `install -Dm644` to the declared target, then
# `systemctl --user daemon-reload`.
#
# ExecStart= with no value clears the unit's own, then the tracked copy is set — the same override
# shape the unit's comments describe for any wrapper.
[Service]
ExecStart=
ExecStart=%h/.local/bin/autotune-resume-quiet-gate.py
