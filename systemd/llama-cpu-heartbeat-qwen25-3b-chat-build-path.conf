# llama-cpu-heartbeat-qwen25-3b-chat-build-path.conf — point the CPU heartbeat rung at
# the CPU build this box actually has.
#
# CARD: LOCAL-FALLBACK-TIER-001 (c0d9a799)   MEASURED: 2026-11-10 09:47-09:55Z, ProArt-P16
#
# THE DEFECT.  The unit's ExecStart names
#     /home/wayne/llama.cpp/build-cpu/bin/llama-server
# and that directory does not exist on this box.  The only CPU-only llama.cpp build
# present is
#     /home/wayne/llama.cpp-glm5next/build-cpu/bin/llama-server    (version 8684)
# so the unit as committed cannot start: it fails at exec and `Restart=always` turns
# that into a crash loop.  The rung was never running here, which is why :18088 answered
# http 000 on 2026-11-04 and why the card could say the ladder had no local rung at all.
#
# THE SAME STALE PATH IS IN TWO MORE PLACES, and they are NOT fixed by this file:
#   * bin/llama-cpu-server — its default `_bin` is $LLAMA_ROOT/build-cpu/bin/llama-server
#   * scripts/01-constants.sh:316 — LLAMA_CPU_SERVER_BIN has the same default
# Both are shared across boxes (the XPS15's :18084 unit runs bin/llama-cpu-server from
# its own store), so changing the default here would be a fleet change, not a host fix.
# This drop-in repairs the one unit on the one box and leaves the shared default alone.
#
# WHY A DROP-IN.  Same shape as 60-ctx-fit-vram.conf on the CUDA lane: the unit's own
# command stays visible, the override is one file, and deleting the file restores the
# committed behaviour.  `ExecStart=` must come first or systemd appends to the list.
#
# EVERYTHING AFTER THE BINARY IS THE UNIT'S OWN COMMAND, UNCHANGED — model, alias, port
# 18088, ctx 8192, 8 threads, batch 256/128, cache-ram 0, --jinja, --metrics.  Only the
# executable path differs.  The reasons for those flags are in the unit and in
# 64ae85d7; they are not re-argued here.
#
# VERIFIED AFTER ENABLING (2026-11-10 09:55Z):
#   /v1/models            200 in 0.0009 s, id qwen2.5-3b-instruct
#   chat completion       34 prompt tokens @ 159.8 tok/s prefill, 2 generated @ 66.6 tok/s
#   MemoryCurrent         4.29 GiB (unit MemoryMax 6G, MemoryHigh 4G)
#   GPU                   0 MiB — the process is absent from the compute-apps list of
#                         nvidia-smi; the build links neither libcuda nor libOpenCL, so
#                         no card sweep can match it either (its exe is under build-cpu/,
#                         outside bin/llama-gpu-clear.sh's reap sets)
[Service]
ExecStart=
ExecStart=/home/wayne/llama.cpp-glm5next/build-cpu/bin/llama-server -m /home/wayne/models/active/qwen2.5-3b-instruct-q4_k_m.gguf --alias qwen2.5-3b-instruct --port 18088 --host 127.0.0.1 --ctx-size 8192 --batch-size 256 --ubatch-size 128 --threads 8 --parallel 1 --cache-ram 0 --jinja --metrics

