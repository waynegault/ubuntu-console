# llama-cuda-lane-arbiter.conf — every start of a CUDA chat lane passes one decision.
#
# CARD: GPU-LANE-ARBITRATION-001 (a946d421)
#
# WHAT WENT WRONG WITHOUT THIS (measured 2026-11-04): a bench held
# /dev/shm/llama-watchdog-cuda.suspend with live pid 3998. The watchdog refused to start
# the chat lane twice (00:36:02, 00:41:03) and the unit was started anyway at 00:42:59
# by something systemd never named; at 00:46:03 the watchdog enforced the hold with
# SIGKILL and four agent sessions lost their turn. The hold was right. The second
# controller was the defect, and it could not be named afterwards.
#
# WHY ExecCondition AND NOT ExecStartPre:
#   A refusal is not a fault, and the difference is measurable. On systemd 259 an
#   ExecCondition exiting 78 gives
#       Skipped due to 'exec-condition'. ... being skipped.
#   with ActiveState=inactive, Result=success, NRestarts=0 — the lane never allocates
#   VRAM, loads a model, or enters `failed`, and Restart=always does not re-run it.
#   ExecStartPre would mark the unit failed and retry every RestartSec, turning one
#   refusal into a crash loop and a false red on the box's only failed unit.
#
# WHY THE RULE LIVES ON THE UNIT AND NOT IN A WRAPPER:
#   The 00:42:59 start came from outside every script we own, so a wrapper only
#   arbitrates the callers that opt in. The unit's own start transaction is the one
#   place every caller meets: `systemctl --user start`, a shell script, a timer, the
#   watchdog, the guard, a dependency job, systemd's own Restart=.
#
# THE SCRIPT: bin/llama-lane-arbiter.sh. It uses the same _tac_suspend_held rule the
#   bench acquirers use (marker + numeric pid + pid alive), so a marker left by a
#   SIGKILLed holder is NOT a hold and cannot wedge the lane down; and it journals the
#   refusing decision with the requester's identity resolved from /proc.
#
# NOT ON THE EMBEDDING LANE, deliberately: LLAMA_LANE_KEEP_UNITS keeps
#   llama-cuda-*-embed resident through a VRAM drain, so refusing its restart during a
#   bench would take memory search down for the bench's length — a different subsystem
#   broken to protect a measurement.
#
# AI INSTRUCTION: a new CUDA *chat* lane gets its own `# install-dropin:` line here.
# install-dropin: llama-cuda-qwen3coder-30b-chat.service 10-lane-arbiter.conf
# install-dropin: llama-cuda-llama32-3b-chat.service 10-lane-arbiter.conf
[Service]
ExecCondition=%h/.local/bin/llama-lane-arbiter.sh check %n
