# runner-cpu-isolation.conf — keep this box's self-hosted CI runners off the CPUs an autotune
# (or bench chunk) is measuring on.
#
# WHY (Wayne, 2026-10-18; option D of his ruling).  A chunk claimed the plan at 12:03:37 and a
# CI job started at 12:03:38, one second later.  With no isolation the two shared all 16 CPUs,
# and that chunk measured at 0.9 cycles/min against 3.05 when the box was clear — which is the
# contention that demotes rows to `indicative` (the two rows owed that day read 28.92% and
# 46.07% position drift, both over the 25% bound, and had to be re-measured).
#
# The runners are SYSTEM units (`actions.runner.*.service`), so this is a root-owned drop-in,
# not a user unit.  Pinning them to the low half leaves the high half for the measurement: a
# chunk's llama-server is deliberately NOT pinned, so it keeps every CPU the runners are not
# using, and an idle runner gives CI everything.
#
# Install: install.sh installs this into the root-owned drop-in directories from the
# declarations below, which are this file's own destination list — `system/` marks a
# root-owned target (card SYSTEMD-DROPIN-INSTALL-001):
# install-dropin: system/actions.runner.waynegault-ubuntu-console.wsl-console-1.service 90-cpu-isolation.conf
# install-dropin: system/actions.runner.waynegault-investigator.wsl-investigator.service 90-cpu-isolation.conf
# install-dropin: system/actions.runner.waynegault-investigator.wsl-nightly.service 90-cpu-isolation.conf
#
# The live half is separate and stays manual: `set-property --runtime` changes the cgroup
# without restarting the unit, and a restart would kill an in-flight job. Drop-ins apply
# at the unit's next start, so run this once for a runner that is already up:
#
#   for u in actions.runner.waynegault-ubuntu-console.wsl-console-1 \
#            actions.runner.waynegault-investigator.wsl-investigator \
#            actions.runner.waynegault-investigator.wsl-nightly; do
#       systemctl set-property --runtime "$u" AllowedCPUs=0-7
#   done
#
# Read back: systemctl show <unit> -p AllowedCPUs --value  ->  0-7
#
# Revision: 2  (bump on ANY change; it is the record a live box is checked against)
[Service]
AllowedCPUs=0-7
