# cpu-affinity-0-7.conf — keep this user unit off CPUs 8-15 while an autotune row measures.
#
# WHY (Wayne, 2026-10-18; option (a) of the CPU-isolation ruling).  Measured DURING a live row
# (chunk 8635, 3-second instantaneous sample): the top consumers inside the "measurement" half
# were the OpenClaw gateway (129 %, affinity 0-15), investigator's graphify (50 %, 0-15) and the
# VS Code server nodes (13 % + 7 %, 0-15) — so CPUs 8-15 were never free, and rows kept reading
# 30-42 % POSITION DRIFT and being stamped INDICATIVE.  Only the CI runners were confined (D,
# AllowedCPUs=0-7, confirmed by their Cpus_allowed_list).
#
# WHY CPUAffinity AND NOT AllowedCPUs HERE.  These are USER units, and user@1000.service
# delegates only `cpu memory pids` on this box — no cpuset.  AllowedCPUs is therefore ACCEPTED
# AND SILENTLY INERT on a user unit (measured 2026-10-18: `systemctl --user show -p AllowedCPUs`
# read `0-7` while the live process still reported Cpus_allowed_list: 0-15).  CPUAffinity= is
# applied by systemd at exec and needs no cpuset controller.  It is also NOT settable through
# `systemctl --user set-property` on this systemd ("Cannot set property CPUAffinity, or unknown
# property"), so it belongs in a unit/drop-in and applies at the unit's NEXT start.
#
# Install (user units, from the repo root):
#   for u in openclaw-gateway.service graphify-mcp-investigator.service \
#            graphify-mcp-openclaw.service graphify-mcp-oilwatch.service \
#            graphify-mcp-ubuntuconsole.service; do
#       install -Dm644 systemd/cpu-affinity-0-7.conf \
#           "$HOME/.config/systemd/user/$u.d/90-cpu-affinity.conf"
#   done
#   systemctl --user daemon-reload
#
# A process ALREADY running keeps its old affinity; pin it live with:
#   taskset -apc 0-7 <pid>
#
# Revision: 1  (bump on ANY change; it is the record a live box is checked against)
[Service]
CPUAffinity=0-7
