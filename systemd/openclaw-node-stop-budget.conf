# openclaw-node-stop-budget.conf — cap the Node Host's stop wait, so a Gateway restart is
# not gated on it.
#
# WHY (measured 2026-10-24, 00:27:55 → 00:33:25 BST).  After the Windows reboot at 00:25:53
# the boot's Gateway start was refused once — "OpenClaw state at …/openclaw.sqlite is
# undergoing offline maintenance" — because the previous distro was cut with 10 s of grace
# (WSL's own "InitTerminateInstanceInternal … systemctl poweroff did not terminate the
# instance in 10000 ms") while the Gateway's drain budget is 330 s.  systemd then scheduled
# the retry (Restart=always, RestartSec=5) at 00:27:55, and it could not run for 5 m 30 s:
# openclaw-node.service is PartOf= the Gateway and ordered AFTER it, so on a Gateway
# (re)start the Node Host must stop first — and it ignores SIGTERM, spending its own full
# TimeoutStopSec=330:
#
#   00:27:55.483  Stopping openclaw-node.service
#   00:33:25.733  openclaw-node.service: State 'stop-sigterm' timed out. Killing.
#   00:33:25.750  Stopped openclaw-node.service
#   00:33:25.789  Starting openclaw-gateway.service        ← 56 ms later
#
# Those 330 s bought nothing: the Node Host's journal for that entire window is
#   node host gateway connect failed: connect ECONNREFUSED 127.0.0.1:18789
# every ~26 s.  It was not draining anything; it was retrying a Gateway that was down.
# 30 s is one full reconnect cycle (measured 26–27 s), so a healthy close is never
# truncated, while the wedged case — which is SIGKILLed today anyway, just five minutes
# late — now costs seconds.
#
# WHAT THIS DOES NOT FIX: the refusal itself.  Nothing inside the guest can drain the
# Gateway during WSL's 10-second teardown of a Windows shutdown, so the first post-shutdown
# boot start is still refused once; this bounds how long the retry then waits.  (The
# in-guest restart path has its own answer: bin/wsl-restart.sh step 1b runs
# bin/gateway-quiesce.sh before `wsl.exe --shutdown`.)
#
# Install (user unit, from the repo root):
#   install -Dm644 systemd/openclaw-node-stop-budget.conf \
#       "$HOME/.config/systemd/user/openclaw-node.service.d/10-stop-budget.conf"
#   systemctl --user daemon-reload
#
# Applies at the unit's NEXT stop; the running Node Host keeps the old budget until then.
# Do not restart it just to apply this — a Gateway restart is exactly what it shortens.
#
# Revision: 1  (bump on ANY change; it is the record a live box is checked against)
[Service]
TimeoutStopSec=30
