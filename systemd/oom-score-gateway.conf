# oom-score-gateway.conf — make the gateway the least killable thing a user unit can be.
#
# WHY.  Measured 2026-11-08: a `--cpu-moe` load held 53.5 GiB in shmem and the kernel's OOM
# killer walked the gateway's cgroup first — it killed a `sleep` (pid 11694) and a `bash`
# (pid 11693) at oom_score_adj:1000, both with task_memcg=openclaw-gateway.service, before
# it reached llama-server.  The unit's own score was 200
# (`systemctl --user show -p OOMScoreAdjust`), i.e. MORE killable than a default process (0).
#
# WHY 100 AND NOT -900.  A USER unit cannot hold a negative score on this box.  Measured with
# transient units (`systemd-run --user --property=OOMScoreAdjust=…`, reading
# /proc/self/oom_score_adj): requested -900/-100/-1/0/99 → applied 100; 101 → 101; 500 → 500.
# systemd ACCEPTS and STORES the negative value (`systemctl show` prints -900 back) while the
# process runs at 100, the floor for an unprivileged user manager — it lacks the
# CAP_SYS_RESOURCE the kernel requires to lower a score.  So writing -900 here would read as
# if it worked.  Going genuinely negative needs a system (root) unit that keeps User=wayne and
# rebuilds the user-manager plumbing; not worth it for a ~60 MiB process.
#
# WHAT THIS DOES NOT DO.  It does not protect the gateway's CHILDREN.  openclaw paints every
# child it spawns with 1000 itself (OOM_SCORE_WRAP_SCRIPT, and the /proc/<pid>/oom_score_adj
# writes in dist/process/spawn-broker/worker.js), so a child's score is an absolute write and
# not an inheritance from this unit.  Those workers stay the first victims by openclaw's own
# design; changing that is an upstream change, not a unit setting.
#
# Applies at the unit's NEXT start — OOMScoreAdjust is set at exec, so a daemon-reload alone
# leaves the running gateway at 200.  Verify with
#   systemctl --user show -p OOMScoreAdjust --value openclaw-gateway.service    # 100
#   cat /proc/$(systemctl --user show -p MainPID --value openclaw-gateway.service)/oom_score_adj
#
# Revision: 1
# install-dropin: openclaw-gateway.service 50-oom-score.conf
[Service]
OOMScoreAdjust=100
