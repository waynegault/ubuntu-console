# openclaw-user-manager-stop-timeout.conf — give the user manager enough stop grace to
# let a host shutdown/reboot drain the Gateway instead of cutting it at 5 s.
#
# WHY (measured 2026-11-19).  `openclaw doctor` and `openclaw gateway status` both report:
#
#   Host shutdown or reboot limits the Gateway drain to 5s; set TimeoutStopSec=90 or longer
#   in /etc/systemd/system/user@1000.service.d/zz-openclaw-stop-timeout.conf (330 preserves
#   the full drain). Reinstalling the Gateway cannot change this host setting.
#   (user@1000.service: 5s (system manager))
#
# The Gateway unit itself carries TimeoutStopSec=330 (its own 5m30s drain budget), but the
# PARENT manager that owns it — user@1000.service — stops at 5 s on host shutdown.  When
# the manager is killed, everything it supervises is torn down with it, so the Gateway's
# 330 s budget is never reached on a reboot; it is truncated at 5 s.  This drop-in lengthens
# the manager's stop budget to 330 s so the two agree and the drain can actually complete.
#
# 330, not 90: it matches the Gateway's own drain exactly, so the child is the thing that
# decides when the stop finishes, not the parent that outlives it.  Raising the child to 330
# and leaving the parent at 90 would still cut the last 240 s on a shutdown.
#
# This is a ROOT-OWNED drop-in (`system/` prefix) because user@.service is a system unit.
# install.sh installs it from the declaration below when passwordless sudo is available; a
# hand-install (one reboot-safe command) is:
#
#   sudo install -Dm644 systemd/openclaw-user-manager-stop-timeout.conf \
#     /etc/systemd/system/user@1000.service.d/zz-openclaw-stop-timeout.conf
#   sudo systemctl daemon-reload
#
# Applies to the NEXT host shutdown/reboot; nothing needs restarting now.
#
# Revision: 1  (bump on ANY change; it is the record a live box is checked against)
# install-dropin: system/user@1000.service zz-openclaw-stop-timeout.conf
[Service]
TimeoutStopSec=330
